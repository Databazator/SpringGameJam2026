name: Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
          - mac
          - webgl

jobs:
  # Linux/Windows/WebGL run on Linux via game-ci docker images.
  build-linux-runner:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.targets == 'all' || github.event.inputs.targets == 'windows' || github.event.inputs.targets == 'linux' || github.event.inputs.targets == 'webgl' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            label: windows
            buildMethod: BuildScript.BuildWindows
            artifactName: SpringGameJam2026-Windows
          - targetPlatform: StandaloneLinux64
            label: linux
            buildMethod: BuildScript.BuildLinux
            artifactName: SpringGameJam2026-Linux
          - targetPlatform: WebGL
            label: webgl
            buildMethod: BuildScript.BuildWebGL
            artifactName: SpringGameJam2026-WebGL
    steps:
      - name: Skip if not requested
        id: gate
        run: |
          want='${{ github.event.inputs.targets }}'
          mine='${{ matrix.label }}'
          if [ "$want" = "all" ] || [ "$want" = "$mine" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          lfs: true

      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - uses: game-ci/unity-builder@v4
        if: steps.gate.outputs.run == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.14f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: ${{ matrix.buildMethod }}
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: ${{ matrix.artifactName }}
          path: Builds
          retention-days: 14

  build-mac:
    name: Build mac
    runs-on: macos-latest
    if: ${{ github.event.inputs.targets == 'all' || github.event.inputs.targets == 'mac' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneOSX-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneOSX-
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.14f1
          targetPlatform: StandaloneOSX
          buildMethod: BuildScript.BuildMac
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: SpringGameJam2026-Mac
          path: Builds
          retention-days: 14
